# YouTube Intelligence Configuration

# Data Paths
data:
  raw_path: data/raw
  cleaned_path: data/cleaned
  embeddings_path: data/embeddings

# YouTube API
youtube:
  api_key: ${YOUTUBE_API_KEY}
  max_results: 1000

# Preprocessing
preprocessing:
  remove_urls: true
  remove_mentions: true
  lowercase: true
  remove_punctuation: true
  min_length: 3

# Sentiment Analysis
sentiment:
  model_type: transformers  # transformers or rule-based
  model_name: distilbert-base-uncased-finetuned-sst-2-english

# Topic Modeling
topic_modeling:
  algorithm: bertopic  # bertopic or lda
  n_topics: 10
  min_df: 2
  max_df: 0.95

# Embeddings
embeddings:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32

# Dashboard
dashboard:
  port: 8501
  theme: light
